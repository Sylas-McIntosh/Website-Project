  <main>
    <h1 class="page-title">Join the Fan Club</h1>
    <form onsubmit="event.preventDefault(); alert('Thanks for joining the Fan Club!');">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your Name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your Email" required>

      <label for="message">Favorite Song / Message</label>
      <textarea id="message" rows="5" placeholder="Tell us your favorite track..." required></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>
